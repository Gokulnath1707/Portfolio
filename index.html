<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Gokulnath B — Product Manager & Developer</title>
    <meta name="description" content="Portfolio of Gokulnath B — an MBA in Marketing & Analytics with hands-on experience in product management, data analytics, and full-stack web development." />

    <!-- Open Graph -->
    <meta property="og:title" content="Gokulnath B — Product Manager & Developer" />
    <meta property="og:description" content="Portfolio of Gokulnath B — product thinking meets technical execution." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/og-image.jpg" />

    <!-- Inter font (variable) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <!-- Prevent flash of wrong theme — runs before React mounts -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
