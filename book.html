<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="assets/gk1.jpg" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ilaigalin Narambugal | Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  </head>
  <body class="book-reader-page">
    <div class="book-app-container">
      
      <!-- Top Header Navigation & Controls -->
      <header class="book-app-header">
        <div class="header-left">
          <a href="index.html" class="book-back-link" title="Back to Portfolio">
            <i class="fas fa-arrow-left"></i> <span>Back</span>
          </a>
        </div>
        
        <div class="header-center">
          <h1 class="book-title-short">Ilaigalin Narambugal</h1>
        </div>
        
        <div class="header-right">
          <!-- Zoom Controls -->
          <div class="zoom-controls">
            <button id="zoomOutBtn" class="control-btn" title="Zoom Out">
              <i class="fas fa-search-minus"></i>
            </button>
            <span id="zoomPercent" class="zoom-text">100%</span>
            <button id="zoomInBtn" class="control-btn" title="Zoom In">
              <i class="fas fa-search-plus"></i>
            </button>
            <button id="zoomResetBtn" class="control-btn" title="Fit Page">
              <i class="fas fa-expand"></i>
            </button>
          </div>
          
          <div class="header-divider"></div>
          
          <!-- View Mode Toggle -->
          <button id="viewModeToggle" class="control-btn" title="Toggle Page Mode (Single/Double)">
            <i class="fas fa-book-open"></i>
          </button>
          
          <!-- Theme Toggle -->
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle Light/Dark Mode">
            <div class="toggle-circle"></div>
          </button>

          <!-- External Open -->
          <a
            href="assets/poem-book.pdf"
            target="_blank"
            rel="noopener noreferrer"
            class="control-btn download-icon-btn"
            title="Open Full Screen PDF"
          >
            <i class="fas fa-external-link-alt"></i>
          </a>
        </div>
      </header>

      <!-- Main Stage Area (Flexbox to scale viewport height) -->
      <main class="book-app-main">
        <button id="prevPageBtn" class="nav-overlay-btn nav-overlay-btn-left" aria-label="Previous page">
          <i class="fas fa-chevron-left"></i>
        </button>

        <div class="book-stage-container">
          <div class="book-stage" id="bookStage">
            <div class="book-stage-shadow"></div>
            <div class="book-page-viewport">
              <div id="currentSpread" class="book-spread current">
                <div class="book-page book-page-left" id="currentLeftPage">
                  <canvas id="currentLeftPageCanvas" class="book-page-canvas" aria-label="Current left page"></canvas>
                </div>
                <div class="book-page book-page-right" id="currentRightPage">
                  <canvas id="currentRightPageCanvas" class="book-page-canvas" aria-label="Current right page"></canvas>
                </div>
              </div>
              <div id="incomingSpread" class="book-spread incoming">
                <div class="book-page book-page-left" id="incomingLeftPage">
                  <canvas id="incomingLeftPageCanvas" class="book-page-canvas" aria-label="Incoming left page"></canvas>
                </div>
                <div class="book-page book-page-right" id="incomingRightPage">
                  <canvas id="incomingRightPageCanvas" class="book-page-canvas" aria-label="Incoming right page"></canvas>
                </div>
              </div>
            </div>
          </div>
        </div>

        <button id="nextPageBtn" class="nav-overlay-btn nav-overlay-btn-right" aria-label="Next page">
          <i class="fas fa-chevron-right"></i>
        </button>
      </main>

      <!-- Bottom Progress Bar & Page Navigation -->
      <footer class="book-app-footer">
        <div class="footer-slider-container">
          <input type="range" id="pageSlider" min="1" max="1" value="1" class="book-page-slider" aria-label="Page slider" />
        </div>
        
        <div class="footer-controls-container">
          <div class="footer-left">
            <span id="bookLoadingState">Loading book...</span>
          </div>
          
          <div class="footer-center">
            <div class="page-navigation-direct">
              <button id="firstPageBtn" class="footer-nav-btn" title="First Page"><i class="fas fa-angle-double-left"></i></button>
              <span class="direct-nav-label">Page</span>
              <input type="number" id="jumpToPageInput" min="1" max="1" value="1" class="jump-page-input" aria-label="Current page input" />
              <span class="direct-nav-total">of <span id="totalPagesText">1</span></span>
              <button id="lastPageBtn" class="footer-nav-btn" title="Last Page"><i class="fas fa-angle-double-right"></i></button>
            </div>
          </div>
          
          <div class="footer-right">
            <span id="pageIndicator" class="page-indicator-text">Page 0 of 0</span>
          </div>
        </div>
      </footer>
    </div>

    <script type="module" src="book.js"></script>
    <script src="main.js"></script>
  </body>
</html>
